name: DevSecOps CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Least privilege: jobs only read the repository unless they ask for more.
permissions:
  contents: read

# Cancel superseded runs of the same ref.
concurrency:
  group: devsecops-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  quality-and-tests:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (clean)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # The app reads NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY. The secret keeps the
          # name requested for the project (ANON_KEY); both hold the public client key.
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/
          retention-days: 7

  security-audit:
    name: Security audit (SCA, secrets, SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the history

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (clean)
        run: npm ci

      - name: Dependency audit (SCA)
        run: npm audit --audit-level=high

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required for organization-owned repositories.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: SAST (Semgrep)
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan \
            --config p/security-audit \
            --config p/typescript \
            --config p/nextjs \
            --config p/owasp-top-ten \
            --error \
            --exclude node_modules --exclude .next --exclude coverage \
            src

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history for blame and new-code detection

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (clean)
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:coverage

      # Secrets are not available to jobs triggered from forks, and the token may not
      # be configured yet. In both cases the scan is skipped instead of failing the run.
      - name: Check SonarCloud token
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SonarCloud skipped::SONAR_TOKEN is not configured. Add it under Settings > Secrets and variables > Actions."
          fi

      # Strict when the token exists: a failed scan or Quality Gate fails the job.
      - name: SonarCloud scan
        if: steps.sonar-token.outputs.present == 'true'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

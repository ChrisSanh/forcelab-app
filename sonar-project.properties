sonar.projectKey=ElWariBana_forcelab-app
sonar.organization=elwaribana
sonar.projectName=ForceLab

# Source and tests live side by side under src/
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.sourceEncoding=UTF-8

# Coverage produced by `npm run test:coverage` (Vitest + v8, lcov reporter)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**,src/components/ui/**

# Never analyse dependencies or build output
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/public/**
